# v7: self-play RL (selfplay.py) from the SE supervised net, with v5's
# warm-start schedule. (v6 extended v5 with 5e-5 / 1e-5 from 100k games; a
# 1.5e-4 peak there regressed to -122 Elo vs v5.) Paths are relative to
# reinforcement-learning/. Earlier runs' exact settings: configs/history/.

# Optimizer. The architecture (incl. SE) comes from init_model's stored config.
lr: 0.0001
min_lr: 0.00002
warmup_games: 1000
lr_schedule_start: 0
weight_decay: 0.0001
episodes: 100000
seed: 2026
disable_amp: false

# Self-play. num_workers null = one per CPU core; the coordinator mostly
# waits on the GPU, and workers idle while their batch is being evaluated.
num_workers: null
games_per_worker: 48
# Playout cap randomization: full searches become training samples.
# Stronger search targets (v5: 400).
full_simulations: 600
fast_simulations: 80
full_search_prob: 0.25
c_puct: 1.41
fpu_reduction: 0.25
temp_threshold: 30
dirichlet_alpha: 0.3
dirichlet_eps: 0.25
max_moves: 240
tree_reuse: true
resign_threshold: -0.9
resign_consecutive: 3
resign_min_ply: 20
resign_playthrough: 0.1
avoid_training_repetitions: true
# A clearly losing side may still learn to claim a repetition draw.
repetition_value_threshold: -0.25
midgame_fens: null
midgame_prob: 0.0

# Training.
q_weight: 0.5
value_coef: 1.0
train_batch_size: 1024
sample_reuse: 4.0
buffer_capacity: 300000
min_buffer_size: 20000
# A fresh warm start leans on human moves early, as v5 did (v6: 0.2).
sl_mix_fraction: 0.3
sl_data_dir: data/lichess_sl
sl_mix_positions: 3000000

# Bookkeeping (games, not rounds).
checkpoint_dir: runs/v7_se
checkpoint_every: 500
checkpoint_keep: 20
replay_save_every: 2000
replay_path: runs/v7_se/replay_buffer.npz
resume: runs/v7_se/latest.pt
init_model: models/chess_sl_model_se.pt
model_out: models/chess_rl_model_v7_se.pt
